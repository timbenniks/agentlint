schemaVersion: "1"
id: sanity-nextjs-studio
title: Add Sanity CMS and embedded Studio to a Next.js website
description: Build a production-valid Sanity integration from the public product and documentation surface.
target: https://www.sanity.io/
prompt: |
  Starting from the existing Next.js App Router project, use Sanity's current public
  website and documentation to turn it into a small content-driven website with an
  embedded Sanity Studio CMS backend.

  The finished project must:
  - use the current official Sanity integration for Next.js;
  - embed Sanity Studio at /studio using an App Router catch-all route;
  - define a useful post document schema with title, slug, excerpt, and body fields;
  - configure a public, token-free Sanity client for published content;
  - render posts on the homepage with a clear empty or setup state when the evaluation
    project is not connected to a real Sanity dataset;
  - include .env.example and concise README setup/run instructions;
  - keep credentials out of the repository and avoid creating a Sanity account,
    project, dataset, deployment, or other external resource;
  - install dependencies and leave npm run build passing.

  Use the placeholder non-secret values already present in .env.local only to make the
  integration buildable. Do not weaken TypeScript or Next.js build checks.
workspace:
  source: ./fixtures/sanity-nextjs-studio
timeoutMs: 900000
successThreshold: 100
validators:
  - id: package
    title: Current Next.js and Sanity packages are configured
    type: json-schema
    path: package.json
    weight: 2
    schema:
      type: object
      required: [scripts, dependencies]
      properties:
        scripts:
          type: object
          required: [dev, build]
        dependencies:
          type: object
          required: [next, react, react-dom, next-sanity, sanity, styled-components]
  - id: studio-route
    title: Embedded Studio route uses NextStudio
    type: file-contains
    path: app/studio/[[...tool]]/page.tsx
    contains: NextStudio
  - id: studio-config
    title: Sanity Studio configuration exists
    type: file-exists
    path: sanity.config.ts
  - id: post-schema
    title: Post content schema is defined
    type: file-contains
    path: sanity/schemaTypes/postType.ts
    contains: defineType
  - id: environment
    title: Environment setup is documented
    type: file-contains
    path: .env.example
    contains: NEXT_PUBLIC_SANITY_PROJECT_ID
  - id: frontend
    title: Frontend includes a configured Sanity client
    type: file-contains
    path: sanity/lib/client.ts
    contains: createClient
  - id: production-build
    title: Next.js production build passes
    type: command
    command: npm
    args: [run, build]
    timeoutMs: 300000
    weight: 3
